# Keeps the GitHub release (and the website's "Download Extension ZIP" link, which points at
# releases/latest) up to date. Runs after every successful Build on main: the release for the
# current version (package.json, e.g. v1.1.0) is moved to the newest commit and its zips are
# replaced. Bumping the version creates a new release. Pushing a v* tag or running it by hand
# also works.
name: Release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave empty to use the version in package.json)'
        required: false
        default: ''

permissions:
  contents: write

# Only the newest run matters; an older one would upload older zips
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    # After Build, only when it passed
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # After Build this is the tip of main, including Build's generated-files commit
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Verify types and lint
        run: |
          npx tsc --noEmit -p .
          npm run lint

      - name: Run test suite
        run: npm test

      - name: Package release archives
        run: node scripts/package.js

      - name: Determine tag name
        id: tag_info
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      # Points the tag at this commit, so the release matches what was built.
      # Tag pushes made with the workflow token do not start workflows, so this cannot loop.
      - name: Move tag to this commit
        if: github.event_name != 'push'
        env:
          TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"

      - name: Write release notes
        env:
          TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          short_sha="$(git rev-parse --short HEAD)"
          built_at="$(date -u '+%Y-%m-%d %H:%M UTC')"
          cat > release-notes.md <<EOF
          ## Blackboarder ${TAG}

          Built from \`${short_sha}\` on ${built_at}. These files are rebuilt after every change to \`main\`, so this download is always the newest version. See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for what changed.

          Student companion for Blackboard Learn Ultra at the University of Sharjah (\`elearning.sharjah.ac.ae\`). It reads announcements and the gradebook, turns them into deadlines and marks, and shows them in a browser extension and a phone app that works offline.

          ### Install in 60 seconds

          1. Download **\`blackboarder-extension.zip\`** below.
          2. Unzip it somewhere you will keep (for example Documents). Moving or deleting the folder removes the extension.
          3. Open your browser's extensions page: \`chrome://extensions\`, \`edge://extensions\`, \`brave://extensions\` or \`opera://extensions\`.
          4. Turn on **Developer mode** and click **Load unpacked**, then pick the unzipped folder.
          5. Pin Blackboarder, open [Blackboard](https://elearning.sharjah.ac.ae/ultra/stream) and click **Scan Blackboard** at the bottom right.

          Already installed from a git clone? The extension updates itself; nothing to download.

          ### Files

          - **\`blackboarder-extension.zip\`**: the extension (Chrome, Edge, Brave, Opera, Vivaldi).
          - **\`blackboarder-website.zip\`**: the landing page and phone app, ready for Cloudflare Pages or Vercel.
          - **\`blackboarder-full-product.zip\`**: extension, website and documentation together.
          - **\`INSTALL_EXTENSION.md\`**: step-by-step setup.
          EOF
          sed -i 's/^          //' release-notes.md

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag_info.outputs.tag }}
        run: |
          files="release/blackboarder-extension.zip release/blackboarder-website.zip release/blackboarder-full-product.zip docs/INSTALL_EXTENSION.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $files --clobber
            gh release edit "$TAG" --title "Blackboarder $TAG" --notes-file release-notes.md --draft=false --prerelease=false --latest
          else
            gh release create "$TAG" $files --title "Blackboarder $TAG" --notes-file release-notes.md --latest
          fi
